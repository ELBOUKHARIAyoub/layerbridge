<!doctype html>
<meta charset="utf-8">
<title>LayerBridge interface preview</title>
<style>
  body { margin: 0; padding: 24px; background: #e9ebef; font: 14px system-ui, sans-serif; color: #222; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) body { background: #0C0B14; color: #ECE9FA }
    :root:not([data-theme=light]) p.sub, :root:not([data-theme=light]) figcaption small { color: #A39FC0 }
    :root:not([data-theme=light]) iframe { border-color: #2E2945; box-shadow: 0 2px 10px #0008 }
  }
  :root[data-theme=dark] body { background: #0C0B14; color: #ECE9FA }
  :root[data-theme=dark] p.sub, :root[data-theme=dark] figcaption small { color: #A39FC0 }
  :root[data-theme=dark] iframe { border-color: #2E2945; box-shadow: 0 2px 10px #0008 }
  h1 { font-size: 18px; margin: 0 0 4px } p.sub { margin: 0 0 18px; color: #666 }
  .wall { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start }
  figure { margin: 0 } figcaption { margin: 0 0 6px; font-weight: 600 } figcaption small { display: block; font-weight: 400; color: #666 }
  iframe { width: 300px; height: 570px; border: 1px solid #c8ccd2; border-radius: 8px; background: #fff; box-shadow: 0 2px 8px #0002 }
</style>
<h1>How the LayerBridge panel looks</h1>
<p class="sub">The real panel code, shown with a pretend hub and a pretend selection. Each box is one panel inside a program.</p>
<div class="wall">
  <figure><figcaption>After Effects<small>3 layers selected, several apps open</small></figcaption><iframe src="panel.html?state=ae"></iframe></figure>
  <figure><figcaption>Figma<small>nothing selected yet</small></figcaption><iframe src="panel.html?state=empty"></iframe></figure>
  <figure><figcaption>Illustrator<small>after pushing, with a warning</small></figcaption><iframe src="panel.html?state=sent"></iframe></figure>
  <figure><figcaption>After Effects<small>two Figma files open</small></figcaption><iframe src="panel.html?state=two"></iframe></figure>
  <figure><figcaption>When the hub isn't running<small>retries on its own</small></figcaption><iframe src="panel.html?state=offline"></iframe></figure>
</div>
<script>
  // ?theme=dark or ?theme=light forces that theme in every panel; otherwise they follow the system.
  const theme = new URLSearchParams(location.search).get("theme");
  if (theme) {
    document.documentElement.setAttribute("data-theme", theme);
    document.querySelectorAll("iframe").forEach((f) => (f.src += "&theme=" + theme));
  }
</script>
